name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, format, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No `version` input on purpose. package.json already carries a
      # `packageManager` field, and passing both makes this action fail with
      # "multiple versions of pnpm specified", which leaves pnpm off the PATH
      # and every later step reporting "pnpm: command not found".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Frozen so a lockfile that drifted from package.json fails loudly here
      # rather than resolving to something different than anyone ran locally.
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # The checks below run even after an earlier one fails, so a single push
      # surfaces every problem instead of one per re-run. They are still gated
      # on install succeeding: if there are no dependencies, running all five is
      # just the same error five times.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      # Coverage rather than a bare run, so the thresholds in vitest.config.ts
      # are enforced here rather than being a number someone checks by hand.
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:coverage

      # Catches anything only a real production build surfaces. No API key is
      # provided on purpose: the app has to build and boot without one.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
